[package]
name = "glyphr"
version = "0.5.1"
edition = "2024"
authors = ["Alessandro Bridi <ale.bridi15@gmail.com>"]
description = "A no_std, lightweight and simple font rasterizing library"
license = "Apache-2.0"
keywords = ["sdf", "font", "rasterizer"]
categories = ["no-std", "no-std::no-alloc", "graphics", "embedded"]
repository = "https://github.com/Bridiro/glyphr"

[dependencies]
glyphr-macros = { path = "../glyphr-macros", version = "0.1.2" }
glyphr-types = { path = "../glyphr-types", version = "0.1.0" }

[dev-dependencies]
minifb = "0.28"

[features]
window = []
toml = ["glyphr-macros/toml"]

[[example]]
name = "glyphr_test"
required-features = ["toml", "window"]

[[example]]
name = "font_cover"
required-features = ["window"]
